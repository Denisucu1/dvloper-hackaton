<path d="M 800 345 C 800 430, 620 430, 620 347" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<text x="600" y="470" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="19" fill="#5b6577">se repetă pe aceleași condiții, ca rezultatul să fie reproductibil</text>
<text x="40" y="515" font-family="DejaVu Sans, Arial" font-size="18" fill="#5b6577">dacă diferența dintre candidați este mică, planul rămâne varianta sigură.</text>
