<text x="160.0" y="319.0" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" font-weight="700" fill="#1d2433">Abordarea B</text>
<rect x="40" y="380" width="240" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="160.0" y="429.0" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" font-weight="700" fill="#1d2433">Abordarea C</text>
