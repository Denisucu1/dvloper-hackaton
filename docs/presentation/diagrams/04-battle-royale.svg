<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="540" fill="#ffffff"/>
<text x="40" y="58" font-family="DejaVu Sans, Arial" font-size="30" font-weight="700" fill="#1d2433">Prep-ul ca un battle royale intern</text>
<text x="40" y="92" font-family="DejaVu Sans, Arial" font-size="19" fill="#5b6577">candidații joacă între ei înainte să joace împotriva adversarului</text>
