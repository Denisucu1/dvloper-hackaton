<text x="490.0" y="279.0" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="22" font-weight="700" fill="#1d2433">Meciuri repetate</text>
<text x="490.0" y="309.0" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="17" fill="#5b6577">aceleași reguli · același timp</text>
<rect x="700" y="225" width="200" height="120" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
<text x="800.0" y="279.0" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#1d2433">Clasament</text>
<text x="800.0" y="309.0" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="17" fill="#5b6577">scor comparabil</text>
<rect x="955" y="225" width="205" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="1057.5" y="279.0" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="20" font-weight="700" fill="#1d2433">Planul meciului</text>
<text x="1057.5" y="309.0" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="17" fill="#5b6577">câștigătorul</text>
<line x1="280" y1="200" x2="358" y2="285" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="280" y1="310" x2="358" y2="285" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="280" y1="420" x2="358" y2="285" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
